<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lounge logo">
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="8" y1="4" x2="56" y2="60">
      <stop offset="0" stop-color="#A79DFF"/>
      <stop offset="0.5" stop-color="#6D5EF8"/>
      <stop offset="1" stop-color="#4A3BDB"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <!-- the L -->
      <rect x="20" y="15" width="8" height="25" rx="4" fill="#000"/>
      <rect x="20" y="32" width="24" height="8" rx="4" fill="#000"/>
      <!-- the "online" dot -->
      <circle cx="43" cy="21.5" r="4.2" fill="#000"/>
    </mask>
  </defs>
  <!-- speech bubble with tail, L and dot cut out of it -->
  <g mask="url(#cut)">
    <rect x="4" y="4" width="56" height="46" rx="18" fill="url(#fill)"/>
    <path d="M11 42 L8 60 Q8 61.5 9.6 60.7 L29 49 Z" fill="url(#fill)"/>
  </g>
</svg>
